name: LibJS reference prototype
on:
  push:
    branches: [main]
    paths:
      - 'ports/libjs/**'
      - '.github/workflows/libjs-reference.yml'
  pull_request:
    paths:
      - 'ports/libjs/**'
      - '.github/workflows/libjs-reference.yml'
  workflow_call:
    inputs:
      sdk:
        description: Build and audit installable Banana SDK packages
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      sdk:
        description: Also build and audit the installable Banana SDK packages
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 120
    steps:
      - name: Install reference toolchain
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git g++ make binutils nasm cmake ninja-build python3 pkg-config libicu-dev libssl-dev libtommath-dev libfast-float-dev
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ports/libjs/src
          key: libjs-sources-${{ hashFiles('ports/libjs/sources.json') }}
      - name: Build and run the semantic probes
        shell: bash
        env:
          BUILD_SDK: ${{ inputs.sdk }}
        run: |
          set -o pipefail
          mode=native
          if [ "$BUILD_SDK" = true ]; then mode=target; fi
          JOBS=2 bash ports/libjs/build.sh "$mode" 2>&1 | tee libjs-reference.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libjs-reference-log
          path: libjs-reference.log
      - name: Stage installable LibJS packages
        if: inputs.sdk
        shell: bash
        run: |
          mkdir -p libjs-packages
          cp apps/libjsprobe/libjsprobe-x86_64.bpk apps/libjsworker/libjsworker-x86_64.bpk libjs-packages/
          cp ports/libjs/build/banana/THIRD_PARTY_NOTICES.txt libjs-packages/LIBJS-THIRD-PARTY-NOTICES.txt
          cd libjs-packages
          sha256sum *.bpk LIBJS-THIRD-PARTY-NOTICES.txt > LIBJS-SHA256SUMS
      - name: Upload installable LibJS packages
        uses: actions/upload-artifact@v4
        if: inputs.sdk
        with:
          name: experimental-libjs-packages
          path: libjs-packages/
          if-no-files-found: error
