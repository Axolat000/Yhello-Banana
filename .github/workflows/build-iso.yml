name: Build ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm gcc-multilib binutils xorriso mtools python3 sbsigntool efitools

      # Secure Boot: the loaders are signed with the Banana OS key (a repository
      # secret); without it (forks) they are built unsigned
      - name: Secure Boot key
        env:
          SB_KEY_PEM: ${{ secrets.BANANA_SB_KEY }}
        run: |
          if [ -n "$SB_KEY_PEM" ]; then
            mkdir -p ~/.banana-secureboot && chmod 700 ~/.banana-secureboot
            printf '%s\n' "$SB_KEY_PEM" > ~/.banana-secureboot/banana-sb.key
            chmod 600 ~/.banana-secureboot/banana-sb.key
          fi

      # FFmpeg for the Media Player and Music apps (ports/ffmpeg/build.sh):
      # built once, then kept until the build script or the SDK's libc changes
      - name: FFmpeg build cache
        uses: actions/cache@v4
        with:
          path: |
            ports/ffmpeg/src
            ports/ffmpeg/build
          key: ffmpeg-7.1-${{ hashFiles('ports/ffmpeg/build.sh', 'sdk/lib/*.c', '!sdk/lib/banana.c', 'sdk/include/**', '!sdk/include/banana*.h') }}

      - name: Build Banana_OS.iso
        run: |
          make clean
          make
          rm -f ~/.banana-secureboot/banana-sb.key

      - name: Set release tag
        id: tag
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Banana OS build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: Banana_OS.iso

  # Java for Banana OS (64-bit): Banana_OS-Java.zip, to unpack on a USB stick -
  # jdk/ (ports/openjdk), lib/libOSMesa.so (ports/mesa: OpenGL 3.3), lwjgl/
  # (ports/lwjgl) and java.bpk. Not in the ISO: Banana OS finds them on /mnt/usb.
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the finished bundle, kept while nothing it is built from changes
      # (before the caches below: their folders must not be hashed)
      - name: Java bundle cache
        id: bundle
        uses: actions/cache@v4
        with:
          path: java-bundle
          key: java-bundle-${{ hashFiles('ports/openjdk/*.sh', 'ports/openjdk/*.py', 'ports/openjdk/include/**', 'ports/openjdk/launcher/*.c', 'ports/openjdk/launcher/Makefile', 'ports/openjdk/test/**', 'ports/mesa/*.sh', 'ports/mesa/*.py', 'ports/mesa/gl3test/*.c', 'ports/mesa/gl3test/Makefile', 'ports/lwjgl/*.sh', 'ports/lwjgl/native/**', 'ports/lwjgl/test/**', 'sdk/lib/**', 'sdk/include/**', 'sdk/banana.mk', 'sdk/tools/**') }}

      - name: Install build dependencies
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          # (room for OpenJDK's reference build)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y gcc-multilib g++ binutils make python3 autoconf zip unzip file libffi-dev \
            mtools fdisk meson ninja-build flex bison python3-mako python3-yaml zlib1g-dev pkg-config \
            libasound2-dev libcups2-dev libfontconfig1-dev libx11-dev libxext-dev libxrender-dev \
            libxrandr-dev libxtst-dev libxt-dev

      # the reference Linux builds (OpenJDK ~1 h, Mesa): their command lines are
      # replayed against the SDK. They depend only on the versions in the scripts:
      # bump the -v suffix when a script's configure / meson options change
      - name: OpenJDK reference build cache
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ports/openjdk/src
          key: openjdk-ref-17.0.20.1-server-v1
      - name: Mesa reference build cache
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ports/mesa/src
            ports/mesa/build/ref
          key: mesa-ref-24.3.4-v1

      - name: Build OpenJDK, Mesa and LWJGL
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          sh ports/openjdk/build.sh
          sh ports/mesa/build.sh
          JAVA_BIN=$PWD/ports/openjdk/src/jdk-17.0.20.1+1/bin sh ports/lwjgl/build.sh

      - name: Pack Banana_OS-Java.zip
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          P=java-bundle/pkg
          rm -rf java-bundle && mkdir -p $P/lib
          cp -r ports/openjdk/build/jdk $P/
          cp ports/openjdk/launcher/java.bpk $P/
          cp ports/mesa/build/libOSMesa.so $P/lib/
          cp -r ports/lwjgl/build/lwjgl $P/
          printf '%s\r\n' \
            'Java for Banana OS (64-bit) - build ${{ github.run_number }}' \
            '' \
            'Unpack this zip to the top of a FAT32 USB stick and plug it in:' \
            '  /mnt/usb/jdk           OpenJDK 17 (the java app and the Minecraft launcher find it)' \
            '  /mnt/usb/lib           libOSMesa.so - OpenGL 3.3 for apps' \
            '  /mnt/usb/lwjgl         LWJGL 3 for Banana OS' \
            '  /mnt/usb/java.bpk      the java app: pkg install /mnt/usb/java.bpk' \
            > $P/README.txt
          (cd $P && zip -qr ../Banana_OS-Java.zip .)
          ls -la java-bundle/Banana_OS-Java.zip
          # the reference builds' objects are not replayed: smaller caches
          find ports/openjdk/src -path '*/build/*' -name '*.o' -delete
          find ports/mesa/build/ref -name '*.o' -delete

      - name: Upload Banana_OS-Java.zip
        uses: actions/upload-artifact@v4
        with:
          name: java-bundle
          path: java-bundle/Banana_OS-Java.zip
          retention-days: 3

  # next to the ISO, in the same pre-release (once both are built)
  publish-java:
    needs: [ build, java ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Banana_OS-Java.zip
        uses: actions/download-artifact@v4
        with:
          name: java-bundle

      - name: Add it to the pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Banana OS build ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: Banana_OS-Java.zip
