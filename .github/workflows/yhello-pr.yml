name: Propose reviewed Banana OS changes

on:
  push:
    branches: [codex/integration]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-integration-pull-request
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or update the integration pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          repository = os.environ['GH_REPOSITORY']
          owner = repository.split('/', 1)[0]
          api = os.environ['GH_API_URL'].rstrip('/') + '/repos/' + repository
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'yhello-integration-pr',
          }

          def request(path, method='GET', data=None):
              payload = None if data is None else json.dumps(data).encode('utf-8')
              req = urllib.request.Request(api + path, data=payload,
                                           headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          def safe_title(message):
              # Treat commit text as display data, never Markdown or executable input.
              lines = message.splitlines()
              title = lines[0][:240] if lines else '(untitled)'
              title = ''.join(c for c in title if c.isprintable())
              title = html.escape(title, quote=True).replace('@', '&#64;')
              return re.sub(r'([\\`*_{}\[\]()#+.!|~-])', r'\\\1', title)

          comparison = request('/compare/main...codex%2Fintegration?per_page=100')
          if not comparison.get('files') or not comparison.get('total_commits'):
              print('No effective changes to propose against main.')
              raise SystemExit(0)

          query = urllib.parse.urlencode({
              'state': 'open', 'head': owner + ':codex/integration',
              'base': 'main', 'per_page': 100,
          })
          existing = request('/pulls?' + query)
          if len(existing) > 1:
              raise RuntimeError('Multiple open PRs for this branch; no new PR created')
          # Keep the human-reviewed feature summary and extend it with concrete
          # new subjects. Internal scheduling commits never become release notes.
          curated = None
          baseline = None
          if existing:
              old_body = existing[0].get('body') or ''
              match = re.search(r'<!-- yhello-summary-start -->(.*?)<!-- yhello-summary-end -->', old_body, re.S)
              head = re.search(r'<!-- yhello-summary-head: ([0-9a-f]{40,64}) -->', old_body)
              if match and head:
                  extra = request('/compare/' + head.group(1) + '...codex%2Fintegration?per_page=100')
                  if extra.get('status') in ('ahead', 'identical'):
                      curated = match.group(1).strip()
                      baseline = head.group(1)
                      comparison = extra

          rows = []
          seen = set()
          first_subject = None
          for commit in comparison.get('commits', []):
              raw = commit['commit']['message'].splitlines()[0]
              raw = re.sub(r'^Merge:\s*', '', raw).strip()
              if (re.match(r'^(Integrate reviewed|Checkpoint|Sync reviewed)\b', raw, re.I)
                      or re.search(r'\bbase-\d+\b|\bstep\s+\d+\b', raw, re.I)):
                  continue
              key = raw.casefold()
              if key in seen:
                  continue
              seen.add(key)
              first_subject = first_subject or raw
              rows.append('- ' + safe_title(raw))

          if curated:
              title = existing[0]['title']
              body = ('<!-- yhello-summary-start -->\n' + curated
                      + '\n<!-- yhello-summary-end -->\n'
                      + '<!-- yhello-summary-head: ' + baseline + ' -->\n')
              if rows:
                  body += '\n### Additional changes since this summary\n\n' + '\n'.join(rows) + '\n'
          else:
              title = (first_subject[:100] if first_subject else 'Review Banana OS feature changes')
              body = '### What this changes\n\n' + ('\n'.join(rows) if rows else
                      'See Files changed for the proposed source changes; a concrete feature summary is required before merging.') + '\n'

          body += ('\n### Test before merging\n\n'
                   'Open the **PR ISO / Downloadable test ISO** check and download its '
                   '**Yhello-Banana-ISO** artifact. Unzip it and boot Banana_OS.iso in a VM '
                   'with Secure Boot disabled. Check SOURCE-COMMIT.txt against the PR head.\n\n'
                   'The controller runs independent integration checks before promoting OS changes. '
                   'See individual check results and validation notes for exact scope; a successful '
                   'build does not establish physical hardware compatibility. '
                   'The user decides whether to merge this PR into main.\n')

          if existing:
              pr = existing[0]
              if pr['title'] != title or pr.get('body') != body:
                  pr = request('/pulls/' + str(pr['number']), 'PATCH',
                               {'title': title, 'body': body})
          else:
              pr = request('/pulls', 'POST', {
                  'title': title, 'body': body,
                  'head': 'codex/integration', 'base': 'main',
              })
          print('PR ready for review and manual merge: ' + pr['html_url'])
          PY
