name: kcmd-output-host regressions
on:
  push:
    branches: ['upstream/kcmd-drain']
  pull_request:
    paths: ['kernel/**', 'net/**', 'sdk/**', 'shell/**', 'tools/**', '.github/workflows/kcmd-output-host.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y gcc-multilib
      - name: Run regressions
        run: |
          python3 tools/test_kcmd_output.py --sanitize
          python3 tools/test_kcmd_output.py --32
          gcc -m64 -ffreestanding -fsyntax-only -Ikernel -Inet -Isdk/include kernel/app.c
          gcc -m32 -ffreestanding -fsyntax-only -Ikernel -Inet -Isdk/include kernel/app.c
