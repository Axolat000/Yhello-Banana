name: latency-host regressions
on:
  push:
    branches: ['upstream/latency-diagnostics']
  pull_request:
    paths: ['kernel/**', 'net/**', 'sdk/**', 'shell/**', 'tools/**', '.github/workflows/latency-host.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y gcc-multilib
      - name: Run regressions
        run: |
          python3 tools/test_latency.py --sanitize
          python3 tools/test_latency.py --32
          gcc -m64 -ffreestanding -fsyntax-only -Ikernel -Inet -Isdk/include kernel/latency.c kernel/timer.c kernel/task.c kernel/keyboard.c kernel/idt.c shell/moncmds.c shell/help.c
          gcc -m32 -ffreestanding -fsyntax-only -Ikernel -Inet -Isdk/include kernel/latency.c kernel/timer.c kernel/task.c kernel/keyboard.c kernel/idt.c shell/moncmds.c shell/help.c
